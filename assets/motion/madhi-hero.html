<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madhi Studio Hero Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/landing.css">
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0 !important;
    overflow: hidden;
    background: #fff;
  }
  body { min-height: 0 !important; }
  .hero.typing-hero-panel {
    width: 100%;
    height: 100vh !important;
    min-height: 100vh !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
  }
  .hero-madhi-background {
    left: 20px !important;
    right: 20px !important;
    width: calc(100% - 40px) !important;
    max-width: none !important;
  }
  .typing-hero-inner {
    width: min(1540px, calc(100% - 80px)) !important;
    max-width: none !important;
  }
  body::before {
    display: none !important;
    content: none !important;
  }
  .hero .hero-title.typing-hero {
    width: min(980px, 100%) !important;
    max-width: 980px !important;
    margin: 0 0 0 auto !important;
    text-align: right !important;
  }
  .type-line {
    text-align: right !important;
  }

  .writing-services-mark {
    position: absolute;
    left: 1.75%;
    bottom: 0;
    width: 72%;
    height: auto;
    display: block;
    z-index: 1;
    pointer-events: none;
    user-select: none;
  }

  /* Continues the extracted baseline to directly beneath the final typed cursor position. */
  .writing-services-line-extension {
    position: absolute;
    left: 72.35%;
    right: 2.25%;
    bottom: 0;
    height: 13px;
    background: #111111;
    z-index: 1;
    pointer-events: none;
  }

  .writing-services-line-extension::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 59%;
    height: 24%;
    background: #ffffff;
  }
</style>
</head>
<body class="section-green">
<section class="hero typing-hero-panel" id="home">
  <img class="writing-services-mark" src="writing-services.svg" alt="" aria-hidden="true">
  <span class="writing-services-line-extension" aria-hidden="true"></span>
  <img alt="" aria-hidden="true" class="hero-madhi-background" src="../madhi.svg">
  <div class="hero-content typing-hero-inner">
    <h1 aria-live="polite" class="hero-title typing-hero" id="heroTitle">
      <span class="type-line" id="typeLineOne"><span id="typeLineOneText"></span></span>
      <span class="type-line" id="typeLineTwo"><span id="typeLineTwoBefore"></span><span class="typed-accent" id="typeAccentMessage"></span></span>
      <span class="type-line" id="typeLineThree"><span id="typeLineThreeBefore"></span><span class="typed-accent" id="typeAccentAudience"></span></span>
      <span class="type-line" id="typeLineFour"><span id="typeLineFourBefore"></span><span class="typed-accent" id="typeAccentTime"></span><span class="hero-period" id="heroPeriod"></span></span>
    </h1>
  </div>
</section>
<script src="../../js/landing.js"></script>
</body>
</html>
