<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 20 1120 695" role="img" aria-labelledby="title desc" style="background:transparent; background-color:transparent;">
  <title id="title">Camera Icon with Blinking Yellow Light</title>
  <desc id="desc">Clean black camera icon with a bright white lens ring and slow blinking yellow light.</desc>

  <defs>
    <linearGradient id="cameraBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      html, body, svg { background: transparent !important; background-color: transparent !important; }

      .yellow-light {
        fill: #fffa00;
        filter: url(#softGlow);
        animation: slowBlink 1.4s ease-in-out infinite;
        transform-origin: 820px 215px;
      }

      @keyframes slowBlink {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.25;
          transform: scale(0.9);
        }
      }
    </style>

    <line id="cut" x1="21" y1="-16.5" x2="78.303" y2="140.953" />
    
    <mask id="aperture-mask">
      <rect x="-120" y="-120" width="240" height="240" fill="white" />
      
      <g fill="black" stroke="black" stroke-width="4.5" stroke-linecap="square">
        <use href="#cut" />
        <use href="#cut" transform="rotate(40)" />
        <use href="#cut" transform="rotate(80)" />
        <use href="#cut" transform="rotate(120)" />
        <use href="#cut" transform="rotate(160)" />
        <use href="#cut" transform="rotate(200)" />
        <use href="#cut" transform="rotate(240)" />
        <use href="#cut" transform="rotate(280)" />
        <use href="#cut" transform="rotate(320)" />
        
        <polygon points="
          27,0 
          20.683,17.355 
          4.688,26.59 
          -13.5,23.383 
          -25.372,9.235 
          -25.372,-9.235 
          -13.5,-23.383 
          4.688,-26.59 
          20.683,-17.355" 
          stroke-linejoin="miter" 
        />
      </g>
    </mask>
  </defs>

  <path
    d="M90 710 Q45 710 45 665 L45 245 Q45 190 100 190 L270 190 Q325 190 350 140 L395 60 Q415 25 460 25 L735 25 Q780 25 800 60 L845 140 Q870 190 925 190 L1100 190 Q1155 190 1155 245 L1155 665 Q1155 710 1110 710 Z"
    fill="url(#cameraBody)"
  />

  <circle cx="600" cy="430" r="215" fill="#ffffff" />

  <svg x="395" y="205" width="408" height="450" viewBox="-120 -120 240 240">
    <g transform="rotate(-12)">
      <circle cx="0" cy="0" r="120" fill="#1d1d1b" mask="url(#aperture-mask)" />
    </g>
  </svg>

  <circle class="yellow-light" cx="820" cy="215" r="22" />
</svg>
