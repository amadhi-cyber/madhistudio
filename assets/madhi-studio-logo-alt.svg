      .line {
        fill: none;
        stroke: #3d3d3d9d;
        stroke-width: 2;
        stroke-linejoin: miter;
        stroke-linecap: butt;
        stroke-miterlimit: 10;
      }

      .brand-sub {
        fill: #0AC92B;
        font-family: "Montserrat", Arial, Helvetica, sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 18px;
      }

      .studio-line {
        fill: none;
        stroke: #0AC92B;
        stroke-width: 2.5;
        stroke-linecap: butt;
      }
    </style>
  </defs>

