  style="background:transparent; background-color:transparent;">

  <defs>
    <!-- animation -->
    <style>
      html, body, svg { background: transparent !important; background-color: transparent !important; }
      .lego-layer {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-duration: 11.5s;
        animation-timing-function: cubic-bezier(.22, .9, .22, 1);
        animation-fill-mode: both;
        animation-iteration-count: 1;
      }

      .lego-bottom {
        animation-name: legoBottomLoop;
      }

      .lego-middle {
        animation-name: legoMiddleLoop;
      }

      .lego-top {
        animation-name: legoTopLoop;
      }

      .lego-block-label {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: -0.04em;
        fill: #FFFFFF;
        text-anchor: middle;
        dominant-baseline: central;
        text-rendering: geometricPrecision;
      }
      @keyframes legoBottomLoop {
        0% {
          opacity: 0;
          transform: translateY(-170px);
        }

        10% {
          opacity: 1;
          transform: translateY(4px);
        }

        13% {
          opacity: 1;
          transform: translateY(-1.5px);
        }

        16%,
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes legoMiddleLoop {
        0%,
        22% {
          opacity: 0;
          transform: translateY(-170px);
        }

        34% {
          opacity: 1;
          transform: translateY(4px);
        }

        37% {
          opacity: 1;
          transform: translateY(-1.5px);
        }

        40%,
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes legoTopLoop {
        0%,
        46% {
          opacity: 0;
          transform: translateY(-170px);
        }

        58% {
          opacity: 1;
          transform: translateY(4px);
        }

        61% {
          opacity: 1;
          transform: translateY(-1.5px);
        }

        64%,
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .lego-layer {
          animation: none;
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>

    <!-- LIGHT GREEN STUD GRADIENT -->
