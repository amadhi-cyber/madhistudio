<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 493 277" width="493" height="277">
  <defs>
    <pattern id="grass" width="48" height="277" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="24" height="277" fill="#39b85a"/>
      <rect x="24" y="0" width="24" height="277" fill="#34b256"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="493" height="277" fill="url(#grass)"/>

  <!-- Pitch markings -->
  <g fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">

    <!-- Outer pitch lines -->
    <line x1="16" y1="7" x2="477" y2="7"/>
    <line x1="16" y1="262" x2="477" y2="262"/>
    <line x1="16" y1="7" x2="16" y2="262"/>
    <line x1="477" y1="7" x2="477" y2="262"/>

    <!-- Halfway line -->
    <line x1="246.5" y1="7" x2="246.5" y2="262"/>

    <!-- Centre circle + spot -->
    <circle cx="246.5" cy="134.5" r="30"/>
    <circle cx="246.5" cy="134.5" r="1.4" fill="#ffffff" stroke="none"/>

    <!-- Left penalty area -->
    <rect x="16" y="73" width="54" height="119"/>
    <rect x="16" y="103" width="20" height="59"/>
    <rect x="9" y="119" width="7" height="28"/>
    <circle cx="52" cy="134.5" r="1.4" fill="#ffffff" stroke="none"/>
    <path d="M70 114 A24 24 0 0 1 70 155"/>

    <!-- Right penalty area -->
    <rect x="423" y="73" width="54" height="119"/>
    <rect x="457" y="103" width="20" height="59"/>
    <rect x="477" y="119" width="7" height="28"/>
    <circle cx="441" cy="134.5" r="1.4" fill="#ffffff" stroke="none"/>
    <path d="M423 114 A24 24 0 0 0 423 155"/>

  </g>
</svg>