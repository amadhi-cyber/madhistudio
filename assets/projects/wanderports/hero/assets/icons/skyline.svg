<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <!-- Window Patterns Definition -->
  <defs>
    <!-- Horizontal striping (used on left & right towers) -->
    <pattern id="win-horiz" x="0" y="0" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="2" width="10" height="4" fill="#d4d4d4" />
    </pattern>
    <!-- Vertical striping (used on the light foreground buildings) -->
    <pattern id="win-vert" x="0" y="0" width="8" height="10" patternUnits="userSpaceOnUse">
      <rect x="2" y="0" width="4" height="10" fill="#e0e0e0" />
    </pattern>
    <!-- Light Grid windows -->
    <pattern id="win-grid-light" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="3" height="3" fill="#f0f0f0" />
      <rect x="7" y="2" width="3" height="3" fill="#f0f0f0" />
      <rect x="2" y="7" width="3" height="3" fill="#f0f0f0" />
      <rect x="7" y="7" width="3" height="3" fill="#f0f0f0" />
    </pattern>
    <!-- Dark Grid windows -->
    <pattern id="win-grid-dark" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="3" height="3" fill="#7a7a7a" />
      <rect x="6" y="1" width="3" height="3" fill="#7a7a7a" />
      <rect x="1" y="6" width="3" height="3" fill="#7a7a7a" />
      <rect x="6" y="6" width="3" height="3" fill="#7a7a7a" />
    </pattern>
    <!-- Sparse vertical windows -->
    <pattern id="win-sparse" x="0" y="0" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="4" height="7" fill="#ffffff" />
    </pattern>
  </defs>

  <!-- Background Sky -->
  <rect width="1000" height="300" fill="#ffffff"/>

  <!-- LAYER 1: Background Buildings (Darkest Grays) -->
  <g fill="#333333">
    <!-- Spires & Antennas -->
    <rect x="85" y="110" width="2" height="30"/>
    <rect x="180" y="100" width="2" height="30"/>
    <rect x="245" y="80" width="3" height="40"/>
    <rect x="415" y="40" width="2" height="30"/>
    <rect x="585" y="70" width="3" height="40"/>
    <rect x="635" y="130" width="2" height="30"/>
    <rect x="860" y="130" width="2" height="30"/>

    <!-- Building Blocks -->
    <rect x="-10" y="130" width="40" height="170"/>
    <rect x="40" y="150" width="30" height="150"/>
    <rect x="160" y="110" width="55" height="190"/>
    <rect x="250" y="130" width="40" height="170"/>
    <rect x="290" y="100" width="35" height="200"/>
    <rect x="360" y="150" width="30" height="150"/>
    <rect x="480" y="110" width="45" height="190"/>
    <rect x="610" y="160" width="30" height="140"/>
    <rect x="670" y="170" width="20" height="130"/>
    <rect x="730" y="140" width="40" height="160"/>
    <rect x="800" y="125" width="50" height="175"/>
    <rect x="870" y="180" width="25" height="120"/>
    <rect x="960" y="170" width="30" height="130"/>
    <rect x="980" y="180" width="30" height="120"/>
  </g>

  <!-- LAYER 2: Midground Buildings (Medium Dark Grays) -->
  <g fill="#4f4f4f">
    <rect x="10" y="120" width="45" height="180"/>
    <rect x="95" y="70" width="50" height="230"/>
    <rect x="200" y="95" width="45" height="205"/>
    <rect x="315" y="85" width="40" height="215"/>
    <rect x="430" y="45" width="55" height="255"/>
    <rect x="560" y="95" width="45" height="205"/>
    <rect x="625" y="150" width="35" height="150"/>
    <rect x="785" y="135" width="40" height="165"/>
    <rect x="840" y="165" width="40" height="135"/>
    <rect x="900" y="135" width="35" height="165"/>
  </g>

  <!-- LAYER 3: Midground Buildings (Medium Light Grays) -->
  <g fill="#757575">
    <rect x="60" y="140" width="40" height="160"/>
    <rect x="120" y="170" width="40" height="130"/>
    <rect x="280" y="150" width="30" height="150"/>
    <rect x="490" y="120" width="55" height="180"/>
    <rect x="640" y="170" width="45" height="130"/>
    <rect x="740" y="125" width="40" height="175"/>
    <rect x="925" y="185" width="35" height="115"/>
  </g>

  <!-- LAYER 4: Foreground Buildings (Light Grays) -->
  <g fill="#9c9c9c">
    <rect x="220" y="180" width="45" height="120"/>
    <rect x="390" y="220" width="55" height="80"/>
    <rect x="815" y="220" width="45" height="80"/>
  </g>

  <g fill="#b8b8b8">
    <rect x="115" y="210" width="45" height="90"/>
    <rect x="300" y="140" width="40" height="160"/>
    <rect x="540" y="180" width="50" height="120"/>
    
    <!-- Distinctive asymmetrical tall tower on the right -->
    <path d="M695,40 L720,35 L725,40 L725,300 L695,300 Z"/>
  </g>

  <!-- LAYER 5: Windows & Facades -->
  <g>
    <!-- Left tall tower (Horizontal) -->
    <rect x="100" y="80" width="40" height="220" fill="url(#win-horiz)"/>
    
    <!-- Left foreground blocks (Grid) -->
    <rect x="120" y="215" width="35" height="85" fill="url(#win-grid-light)"/>
    <rect x="65" y="150" width="30" height="150" fill="url(#win-grid-dark)"/>
    
    <!-- Sparse vertical windows on mid-left tower -->
    <rect x="305" y="150" width="30" height="150" fill="url(#win-sparse)"/>
    
    <!-- Horizontal strips on medium-dark mid-left building -->
    <rect x="320" y="95" width="30" height="205" fill="url(#win-horiz)"/>
    
    <!-- Central towering block (Grid) -->
    <rect x="435" y="120" width="45" height="180" fill="url(#win-grid-light)"/>
    
    <!-- Central lower foreground (Grid) -->
    <rect x="395" y="225" width="45" height="75" fill="url(#win-grid-dark)"/>
    
    <!-- Right-mid lower block (Grid) -->
    <rect x="495" y="130" width="45" height="170" fill="url(#win-grid-dark)"/>
    
    <!-- Thick foreground block (Vertical lines) -->
    <rect x="545" y="185" width="40" height="115" fill="url(#win-vert)"/>
    
    <!-- Distinctive tall jagged tower on the right (Vertical lines) -->
    <path d="M697,45 L718,40 L723,45 L723,300 L697,300 Z" fill="url(#win-vert)"/>
    
    <!-- Right side horizontal striped building -->
    <rect x="745" y="135" width="30" height="165" fill="url(#win-horiz)"/>
    
    <!-- Foreground light block right (Vertical) -->
    <rect x="820" y="230" width="35" height="70" fill="url(#win-vert)"/>
    
    <!-- Far right dark horizontal -->
    <rect x="905" y="145" width="25" height="155" fill="url(#win-horiz)"/>
    
    <!-- Far right lower grid -->
    <rect x="930" y="195" width="25" height="105" fill="url(#win-grid-light)"/>
  </g>

  <!-- Base / Ground Line to create the flat bottom -->
  <rect x="0" y="296" width="1000" height="4" fill="#1a1a1a"/>
</svg>
