      font-size: 19.8px;
      font-weight: 500;
      letter-spacing: 3px;
      fill: #040302;
    }

    .score {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #040302;
    }

    .highlight {
      stroke-width: 46;
      stroke-linecap: round;
      opacity: .88;
