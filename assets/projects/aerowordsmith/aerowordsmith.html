<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroWordsmith | Airport Word Game</title>

<style>
:root{
  --green:#47D45A;
  --green-soft:#eaf9ed;
  --green-dark:#176c2a;
  --ink:#3f4347;
  --muted:#70757a;
  --light-blue:#DDF4FF;
  --border:rgba(17,17,17,.10);
  --select:#eef1f3;
  --white:#ffffff;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}

button{font:inherit}

.page{
  width:100%;
  height:100vh;
  margin:0;
  padding:0;
}

.page-header{
  max-width:820px;
  margin:0 0 20px;
}

.eyebrow{
  margin:0 0 8px;
  color:var(--green);
  font-size:13px;
  font-weight:800;
  letter-spacing:.09em;
  text-transform:uppercase;
}

.page-header h1{
  margin:0;
  color:#5d5d5d;
  font-size:clamp(28px,3vw,40px);
  font-weight:600;
  line-height:1.05;
  letter-spacing:-.7px;
}

.page-header p{
  margin:14px 0 0;
  max-width:820px;
  color:var(--muted);
  font-size:clamp(16px,1.3vw,19px);
  line-height:1.55;
}

.instructions-wrap{
  max-width:820px;
  margin-bottom:20px;
}

.info-card{
  width:100%;
  background:var(--light-blue);
  border:0;
  border-radius:20px;
  padding:18px 22px 20px;
}

.info-card h2{
  margin:0 0 10px;
  color:#72777c;
  font-size:15px;
  font-weight:700;
}

.info-card ul{
  margin:0;
  padding-left:19px;
  color:#596066;
  font-size:13px;
  line-height:1.55;
}

.info-card li + li{
  margin-top:3px;
}

.embedded-info-card{
  background:var(--light-blue);
  border-radius:20px;
  padding:14px 18px;
}

.embedded-info-card p{
  margin:0;
  color:#596066;
  font-size:12px;
  line-height:1.48;
}

.embedded-info-card p + p{
  margin-top:4px;
}

.toolbar-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:10px;
}

.game-btn{
  min-height:36px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:999px;
  background:#fff;
  color:var(--ink);
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}

.game-btn:hover{
  transform:translateY(-1px);
  border-color:var(--green);
}

.game-btn.primary{
  background:var(--green);
  border-color:var(--green);
  color:#143719;
}

.game-shell{
  width:100%;
  height:100vh;
  min-height:0;
  background:#fff;
  border:0;
  border-radius:0;
  overflow:hidden;
}

.game-area{
  display:grid;
  grid-template-columns:minmax(0,1.68fr) minmax(285px,.92fr);
  gap:20px;
  align-items:stretch;
  width:100%;
  height:100vh;
  min-height:0;
  padding:12px 14px;
}

.board-panel{
  min-width:0;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.board-wrap{
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  margin:0;
  padding:0;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
}
.word-grid{
  --size:20;
  display:grid;
  grid-template-columns:repeat(var(--size),1fr);
  width:min(100%, calc(100vh - 24px));
  height:auto;
  aspect-ratio:1 / 1;
  margin:auto;
  border:1px solid #cdd1d4;
  background:#fff;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  overflow:hidden;
}

.cell{
  display:grid;
  place-items:center;
  min-width:0;
  min-height:0;
  border:0;
  border-right:1px solid #e7eaec;
  border-bottom:1px solid #e7eaec;
  background:#fff;
  color:#24272a;
  padding:0;
  font-size:clamp(12px, 1.38vmin, 19px);
  font-weight:700;
  line-height:1;
  cursor:pointer;
  transition:background .08s ease,color .08s ease,box-shadow .08s ease;
}

.cell.preview{
  background:var(--select);
  box-shadow:inset 0 0 0 2px rgba(71,212,90,.55);
}

.cell.anchor{
  background:#d9f6df;
  box-shadow:inset 0 0 0 3px var(--green);
}

.cell.found{
  background:var(--green);
  color:#17331c;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
}

.word-panel{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-self:stretch;
  padding:2px 2px 0 0;
  border:0;
  background:transparent;
  overflow:hidden;
}

.word-panel h2{
  width:100%;
  margin:0;
  color:var(--ink);
  text-align:center;
  font-size:clamp(15px,1.25vw,19px);
  font-weight:700;
  letter-spacing:-.2px;
}

.word-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(13,minmax(0,1fr));
  column-gap:16px;
  row-gap:0;
  flex:1 1 auto;
  min-height:0;
  align-content:stretch;
  transform:translateY(14px);
  padding:10px 0 12px;
}

.word-item{
  display:flex;
  align-items:baseline;
  gap:6px;
  min-height:0;
  padding:1px 0;
  color:var(--ink);
  font-size:clamp(10px,.82vw,14px);
  font-weight:700;
  line-height:1;
  white-space:nowrap;
  transition:background .14s ease,color .14s ease;
}

.word-item .letter{
  flex:0 0 16px;
  color:#4a4f54;
  font-weight:800;
  font-size:1.2em;
  line-height:1;
  position:relative;
  top:2px;
}

.word-item .word-label{
  line-height:1;
}

.word-item.found{
  color:#2d5133;
  background:transparent;
  text-decoration-line:line-through;
  text-decoration-thickness:2px;
  text-decoration-color:var(--green-dark);
}

.word-item.found .letter{
  color:var(--green-dark);
}

.status-block{
  width:100%;
  margin-top:0;
  padding-top:0;
  border-top:0;
  flex:0 0 auto;
  text-align:center;
}

.status{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  text-align:center;
}

.status strong{
  display:block;
  width:100%;
  color:#7a7f84;
  font-size:15.6px;
  font-weight:700;
  line-height:1.1;
  text-align:center;
}

.status span{
  color:var(--muted);
  font-size:10px;
  line-height:1.25;
}

.completion{
  display:none;
  margin-top:10px;
  padding:9px 10px;
  border-radius:10px;
  background:var(--green);
  color:#18391e;
  font-size:12px;
  font-weight:800;
  text-align:center;
}

.completion.show{display:block}

@media(max-width:760px){
  html,body{overflow:auto;}
  .page,.game-shell{height:auto;min-height:100vh;}
  .game-area{
    grid-template-columns:1fr;
    height:auto;
    min-height:100vh;
  }
  .board-wrap{min-height:70vw;}
  .word-grid{width:min(100%,86vw);}
  .word-panel{min-height:430px;}
}

@media(max-width:700px){
  .page{
    width:min(100% - 20px,1380px);
    padding-top:16px;
  }

  .info-card{
    padding:16px 18px;
  }

  .game-area{
    padding:12px;
    gap:18px;
  }

  .word-list{
    grid-template-columns:1fr 1fr;
  }

  .cell{
    font-size:clamp(11px,3.1vw,17px);
  }
}

@media(max-width:480px){
  .word-list{
    grid-template-columns:1fr;
  }
}

@media(prefers-reduced-motion:reduce){
  *{transition:none!important}
}
@media(max-width:700px){
  .embedded-info-card p{font-size:11px;line-height:1.4;}
}
</style>


<style id="madhi-mobile-embedded-layout-fix">
@media(max-width:760px){
  html,body{overflow:hidden!important;height:100%!important;}
  .page,.game-shell{height:100vh!important;min-height:0!important;}
  .game-area{
    grid-template-columns:minmax(0,1.58fr) minmax(118px,.72fr)!important;
    gap:8px!important;
    height:100vh!important;
    min-height:0!important;
    padding:8px!important;
  }
  .board-wrap{min-height:0!important;}
  .word-grid{width:min(100%,calc(100vh - 16px))!important;}
  .word-panel{min-height:0!important;height:100%!important;padding-right:0!important;}
  .word-panel h2{font-size:11px!important;}
  .word-list{grid-template-columns:1fr 1fr!important;column-gap:5px!important;transform:none!important;padding:4px 0!important;}
  .word-item{gap:2px!important;font-size:7.6px!important;}
  .word-item .letter{flex-basis:9px!important;font-size:1.05em!important;}
  .status strong{font-size:10px!important;}
  .status span{font-size:7px!important;}
  .cell{font-size:clamp(8px,2.3vw,11px)!important;}
}
@media(max-width:480px){
  .word-list{grid-template-columns:1fr 1fr!important;}
}
</style>

</head>

<body>
<main class="page">
  <section class="game-shell" aria-label="AeroWordsmith airport word game">
    <div class="game-area">
      <section class="board-panel" aria-label="Airport word grid">
        <div class="board-wrap">
          <div id="wordGrid" class="word-grid" role="grid" aria-label="20 by 20 AeroWordsmith letter grid"></div>
        </div>
      </section>

      <aside class="word-panel" aria-label="A to Z airport word list">
        <h2>A to Z Airport Words</h2>
        <div id="wordList" class="word-list"></div>
        <div class="status-block">
          <div class="status">
            <strong id="progressText">0 of 26 found</strong>
            <span id="message" aria-live="polite"></span>
          </div>
          <div id="completion" class="completion">All 26 airport words found!</div>
        </div>
      </aside>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const GRID_SIZE = 20;
  const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  /*
    This keeps the A-to-Z word list from the earlier Airport Operations
    Explained word-search concept. Spaces and hyphens are removed only
    inside the puzzle grid; the displayed word keeps its normal wording.
  */
  const WORDS = [
    { letter:"A", label:"AIRPORT" },
    { letter:"B", label:"BAGGAGE" },
    { letter:"C", label:"CONTROL TOWER" },
    { letter:"D", label:"DEICING" },
    { letter:"E", label:"ENGINE" },
    { letter:"F", label:"FIRE TRUCK" },
    { letter:"G", label:"GATE" },
    { letter:"H", label:"HELICOPTER" },
    { letter:"I", label:"INFORMATION DESK" },
    { letter:"J", label:"JET BRIDGE" },
    { letter:"K", label:"KID PLAYSTATION" },
    { letter:"L", label:"LIGHT" },
    { letter:"M", label:"MOVING WALKWAY" },
    { letter:"N", label:"NOSE" },
    { letter:"O", label:"OPERATIONS" },
    { letter:"P", label:"PROPELLER" },
    { letter:"Q", label:"QUEUE" },
    { letter:"R", label:"RUNWAY" },
    { letter:"S", label:"SNOW PLOW" },
    { letter:"T", label:"TUG" },
    { letter:"U", label:"UNIFORM" },
    { letter:"V", label:"VEST" },
    { letter:"W", label:"WINDSOCK" },
    { letter:"X", label:"X-RAY MACHINE" },
    { letter:"Y", label:"YELLOW" },
    { letter:"Z", label:"ZULU" }
  ].map(item => ({
    ...item,
    key:item.label.replace(/[^A-Z]/g,"")
  }));

  const DIRECTIONS = [
    { dr: 0, dc: 1 },   // left -> right
    { dr: 0, dc:-1 },   // right -> left
    { dr: 1, dc: 0 },   // top -> bottom
    { dr:-1, dc: 0 },   // bottom -> top
    { dr: 1, dc: 1 },   // diagonal down-right
    { dr:-1, dc:-1 },   // diagonal up-left
    { dr: 1, dc:-1 },   // diagonal down-left
    { dr:-1, dc: 1 }    // diagonal up-right
  ];

  const gridEl = document.getElementById("wordGrid");
  const wordListEl = document.getElementById("wordList");
  const progressText = document.getElementById("progressText");
  const messageEl = document.getElementById("message");
  const completionEl = document.getElementById("completion");
  const newPuzzleBtn = document.getElementById("newPuzzleBtn");
  const clearSelectionBtn = document.getElementById("clearSelectionBtn");

  let board = [];
  let cells = [];
  let foundWords = new Set();

  let pointerSelecting = false;
  let pointerMoved = false;
  let pointerStart = null;
  let currentPreview = [];
  let tapAnchor = null;

  function randomInt(max){
    return Math.floor(Math.random() * max);
  }

  function blankBoard(){
    return Array.from({length:GRID_SIZE}, () =>
      Array.from({length:GRID_SIZE}, () => "")
    );
  }

  function canPlace(word, row, col, dr, dc, targetBoard){
    const lastRow = row + dr * (word.length - 1);
    const lastCol = col + dc * (word.length - 1);

    if (
      lastRow < 0 || lastRow >= GRID_SIZE ||
      lastCol < 0 || lastCol >= GRID_SIZE
    ){
      return false;
    }

    for(let i=0;i<word.length;i++){
      const r = row + dr*i;
      const c = col + dc*i;
      const existing = targetBoard[r][c];

      if(existing && existing !== word[i]){
        return false;
      }
    }

    return true;
  }

  function placeWord(word, targetBoard){
    /*
      Try many random positions/directions. Allowing matching letters
      to overlap produces a denser, more natural word-search puzzle.
    */
    for(let attempt=0;attempt<1600;attempt++){
      const dir = DIRECTIONS[randomInt(DIRECTIONS.length)];
      const row = randomInt(GRID_SIZE);
      const col = randomInt(GRID_SIZE);

      if(!canPlace(word,row,col,dir.dr,dir.dc,targetBoard)){
        continue;
      }

      for(let i=0;i<word.length;i++){
        targetBoard[row + dir.dr*i][col + dir.dc*i] = word[i];
      }

      return true;
    }

    return false;
  }

  function buildPuzzle(){
    /*
      Place longest words first. If one complete board attempt fails,
      start again. A 20x20 board gives these 26 words plenty of room.
    */
    const longestFirst = [...WORDS].sort((a,b) => b.key.length - a.key.length);

    for(let boardAttempt=0;boardAttempt<80;boardAttempt++){
      const candidate = blankBoard();
      let ok = true;

      for(const item of longestFirst){
        if(!placeWord(item.key,candidate)){
          ok = false;
          break;
        }
      }

      if(!ok) continue;

      for(let r=0;r<GRID_SIZE;r++){
        for(let c=0;c<GRID_SIZE;c++){
          if(!candidate[r][c]){
            candidate[r][c] = ALPHABET[randomInt(ALPHABET.length)];
          }
        }
      }

      return candidate;
    }

    throw new Error("Could not generate Terminal Tangle puzzle.");
  }

  function renderWordList(){
    wordListEl.innerHTML = "";

    WORDS.forEach(item => {
      const row = document.createElement("div");
      row.className = "word-item";
      row.dataset.word = item.key;

      const letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = item.letter;

      const label = document.createElement("span");
      label.className = "word-label";
      label.textContent = item.label;

      row.append(letter,label);
      wordListEl.appendChild(row);
    });
  }

  function renderGrid(){
    gridEl.innerHTML = "";
    cells = [];

    for(let r=0;r<GRID_SIZE;r++){
      for(let c=0;c<GRID_SIZE;c++){
        const button = document.createElement("button");
        button.type = "button";
        button.className = "cell";
        button.textContent = board[r][c];
        button.dataset.row = r;
        button.dataset.col = c;
        button.setAttribute("role","gridcell");
        button.setAttribute("aria-label",`${board[r][c]}, row ${r+1}, column ${c+1}`);

        gridEl.appendChild(button);
        cells.push(button);
      }
    }
  }

  function cellAt(row,col){
    if(row<0 || col<0 || row>=GRID_SIZE || col>=GRID_SIZE) return null;
    return cells[row*GRID_SIZE + col] || null;
  }

  function coordsOf(cell){
    return {
      row:Number(cell.dataset.row),
      col:Number(cell.dataset.col)
    };
  }

  function clearPreview(){
    currentPreview.forEach(cell => cell.classList.remove("preview"));
    currentPreview = [];
  }

  function clearAnchor(){
    if(tapAnchor){
      tapAnchor.classList.remove("anchor");
      tapAnchor = null;
    }
  }

  function clearSelection(){
    clearPreview();
    clearAnchor();
    pointerStart = null;
    pointerSelecting = false;
    pointerMoved = false;
    messageEl.textContent = "Selection cleared.";
  }

  function pathBetween(startCell,endCell){
    const a = coordsOf(startCell);
    const b = coordsOf(endCell);

    const drRaw = b.row - a.row;
    const dcRaw = b.col - a.col;

    if(drRaw === 0 && dcRaw === 0){
      return [startCell];
    }

    const absR = Math.abs(drRaw);
    const absC = Math.abs(dcRaw);

    /*
      Valid word-search lines:
      horizontal, vertical, or 45-degree diagonal.
    */
    if(!(drRaw === 0 || dcRaw === 0 || absR === absC)){
      return [];
    }

    const dr = Math.sign(drRaw);
    const dc = Math.sign(dcRaw);
    const length = Math.max(absR,absC) + 1;
    const path = [];

    for(let i=0;i<length;i++){
      const cell = cellAt(a.row + dr*i,a.col + dc*i);
      if(!cell) return [];
      path.push(cell);
    }

    return path;
  }

  function previewPath(startCell,endCell){
    clearPreview();

    const path = pathBetween(startCell,endCell);
    currentPreview = path;

    path.forEach(cell => {
      if(!cell.classList.contains("found")){
        cell.classList.add("preview");
      }
    });
  }

  function wordFromPath(path){
    return path.map(cell => cell.textContent).join("");
  }

  function findMatchingWord(text){
    const reverse = [...text].reverse().join("");

    return WORDS.find(item =>
      !foundWords.has(item.key) &&
      (item.key === text || item.key === reverse)
    ) || null;
  }

  function markFound(item,path){
    foundWords.add(item.key);

    path.forEach(cell => {
      cell.classList.remove("preview","anchor");
      cell.classList.add("found");
    });

    const listItem = wordListEl.querySelector(`[data-word="${item.key}"]`);
    if(listItem){
      listItem.classList.add("found");
      listItem.setAttribute("aria-label",`${item.label} found`);
    }

    progressText.textContent = `${foundWords.size} of ${WORDS.length} found`;
    messageEl.textContent = `${item.label} found!`;

    if(foundWords.size === WORDS.length){
      completionEl.classList.add("show");
      messageEl.textContent = "All 26 airport words found!";
    }
  }

  function evaluatePath(path){
    if(!path || path.length < 2){
      messageEl.textContent = "Select the complete word from first letter to last.";
      clearPreview();
      return;
    }

    const text = wordFromPath(path);
    const match = findMatchingWord(text);

    if(match){
      markFound(match,path);
    }else{
      messageEl.textContent = "Not one of the remaining words. Try again.";
      clearPreview();
    }
  }

  function cellFromPoint(x,y){
    const target = document.elementFromPoint(x,y);
    return target ? target.closest(".cell") : null;
  }

  /*
    POINTER / TOUCH DRAG
    Works with mouse, pen, and touch using Pointer Events.
  */
  gridEl.addEventListener("pointerdown", event => {
    const cell = event.target.closest(".cell");
    if(!cell) return;

    event.preventDefault();

    pointerSelecting = true;
    pointerMoved = false;
    pointerStart = cell;

    clearPreview();

    try{
      gridEl.setPointerCapture(event.pointerId);
    }catch(error){}

    previewPath(cell,cell);
  });

  gridEl.addEventListener("pointermove", event => {
    if(!pointerSelecting || !pointerStart) return;

    const cell = cellFromPoint(event.clientX,event.clientY);
    if(!cell || !gridEl.contains(cell)) return;

    if(cell !== pointerStart){
      pointerMoved = true;
    }

    previewPath(pointerStart,cell);
  });

  gridEl.addEventListener("pointerup", event => {
    if(!pointerSelecting || !pointerStart) return;

    event.preventDefault();

    const endCell = cellFromPoint(event.clientX,event.clientY) || pointerStart;

    /*
      If the pointer actually moved, treat this as a drag selection.
      If it did not move, use two-tap selection mode.
    */
    if(pointerMoved){
      const path = pathBetween(pointerStart,endCell);
      evaluatePath(path);
      clearAnchor();
    }else{
      clearPreview();

      if(!tapAnchor){
        clearAnchor();
        tapAnchor = pointerStart;
        tapAnchor.classList.add("anchor");
        messageEl.textContent = "Start letter selected. Tap the last letter.";
      }else{
        const start = tapAnchor;
        const path = pathBetween(start,endCell);
        clearAnchor();
        evaluatePath(path);
      }
    }

    pointerSelecting = false;
    pointerStart = null;
    pointerMoved = false;

    try{
      gridEl.releasePointerCapture(event.pointerId);
    }catch(error){}
  });

  gridEl.addEventListener("pointercancel", () => {
    pointerSelecting = false;
    pointerStart = null;
    pointerMoved = false;
    clearPreview();
  });

  /*
    KEYBOARD ACCESS:
    pressing Enter/Space on a cell uses the same two-step selection.
  */
  gridEl.addEventListener("keydown", event => {
    if(event.key !== "Enter" && event.key !== " ") return;

    const cell = event.target.closest(".cell");
    if(!cell) return;

    event.preventDefault();

    if(!tapAnchor){
      clearAnchor();
      tapAnchor = cell;
      cell.classList.add("anchor");
      messageEl.textContent = "Start letter selected. Choose the last letter.";
    }else{
      const start = tapAnchor;
      const path = pathBetween(start,cell);
      clearAnchor();
      evaluatePath(path);
    }
  });

  clearSelectionBtn?.addEventListener("click", clearSelection);

  newPuzzleBtn?.addEventListener("click", () => {
    foundWords = new Set();
    completionEl.classList.remove("show");
    clearPreview();
    clearAnchor();

    board = buildPuzzle();
    renderGrid();
    renderWordList();

    progressText.textContent = `0 of ${WORDS.length} found`;
    messageEl.textContent = "New puzzle ready. Find an airport word.";
  });

  /*
    INITIALIZE
  */
  board = buildPuzzle();
  renderGrid();
  renderWordList();
})();
</script>
</body>
