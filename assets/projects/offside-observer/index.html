<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offside Observer | Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--oo-green:#006400;--ink:#111;--paper:#fff}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);display:grid;grid-template-rows:18vh 1fr 8vh}
header,footer{background:var(--oo-green)}
header{display:flex;align-items:center;padding:0 2vw;min-height:0}
.logo{height:min(15vh,132px);width:auto;max-width:min(520px,70vw);display:block}
main{min-height:0;display:flex;align-items:center;padding:2.2vh 2vw}
.article-grid{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.35vw;align-items:stretch}
.article-card{min-width:0;border:3px solid var(--oo-green);border-radius:10px;overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:background .22s ease,border-color .22s ease,color .22s ease}
.article-card:hover{background:var(--oo-green);border-color:var(--oo-green)}
.article-card:hover h2{color:#fff}
.article-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.article-card h2{font-size:clamp(11px,1.25vw,21px);line-height:1.22;font-weight:700;padding:clamp(8px,1vw,16px);min-height:3.9em}
footer{display:flex;align-items:flex-end;justify-content:center;color:#fff;font-size:clamp(14.04px,1.092vw,18.72px);padding-bottom:.65vh}
@media(max-width:760px){body{grid-template-rows:16vh 1fr 7vh}.article-grid{gap:1vw}.article-card{border-width:2px}.article-card h2{font-size:clamp(9px,2.1vw,14px);padding:6px}.logo{max-width:78vw}}
</style>
</head>
<body>
<header>
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" role="img" aria-label="Offside Observer logo">
    <g transform="translate(15,5)">
      <rect x="0" y="0" width="100" height="140" fill="none" stroke="#fff" stroke-width="2"/>
      <rect x="10" y="0" width="80" height="10" fill="none" stroke="#fff" stroke-width="2"/>
      <rect x="10" y="130" width="80" height="10" fill="none" stroke="#fff" stroke-width="2"/>
      <line x1="0" y1="70" x2="100" y2="70" stroke="#fff" stroke-width="2"/>
      <circle cx="50" cy="70" r="15" fill="none" stroke="#fff" stroke-width="2"/>
    </g>
    <text x="85" y="81" font-family="'Cedarville Cursive',cursive" font-size="36" fill="#fff">ffside</text>
    <text x="83" y="127" font-family="'Cedarville Cursive',cursive" font-size="36" fill="#fff">bserver</text>
    <image href="images/ui/soccer-ball.svg" x="47" y="94" width="36" height="36" preserveAspectRatio="xMidYMid meet"/>
  </svg>
</header>
<main>
  <section class="article-grid" aria-label="Featured Offside Observer articles">
    <article class="article-card"><img src="images/article/italy-out-4x3.jpg" alt="Italy football"><h2>Italy Out of World Cup</h2></article>
    <article class="article-card"><img src="images/article/final-wc-spots-final-4x3.jpg" alt="World Cup qualifying"><h2>Final World Cup spots decided in chaotic fashion</h2></article>
    <article class="article-card"><img src="images/article/iraq-qualifies-4x3.jpg" alt="Iraq football"><h2>Iraq’s qualification is one of the biggest feel-good stories</h2></article>
    <article class="article-card"><img src="images/article/chelsea-financial-crisis-4x3.jpg" alt="Chelsea football"><h2>Chelsea’s financial crisis hits historic levels</h2></article>
  </section>
</main>
<footer>© Offside Observer</footer>
</body>
</html>
