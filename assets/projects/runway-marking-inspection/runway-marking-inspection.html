<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runway Inspection Game — Revised Prototype</title>

<style>
  :root {
    --green:#0AC92B;
    --ink:#111;
    --muted:#61676d;
    --border:#d9dde1;
    --bg:#f5f6f7;
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    background:var(--bg);
    font-family:Arial,Helvetica,sans-serif;
    color:var(--ink);
  }

  body{min-height:100vh;overflow:hidden}

  .prototype-wrap{
    width:100%;
    max-width:none;
    margin:0;
    padding:0;
    height:100vh;
  }

  .title-row{
    display:none;
  }

  h1{
    font-size:clamp(30px,3vw,48px);
    line-height:1;
    margin:0;
    letter-spacing:-1.5px;
  }

  .title-row p{
    margin:0;
    color:var(--muted);
    font-size:14px;
    max-width:560px;
    line-height:1.4;
  }

  .game-shell{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(190px, 18vw);
    gap:16px;
    align-items:stretch;
    height:100vh;
    min-height:100vh;
    padding:14px;
  }

  .main-card,
  .overview-card{
    border-radius:24px;
    overflow:hidden;
    position:relative;
    box-shadow:0 18px 50px rgba(0,0,0,.14);
  }

  .main-card{
    background:#111;
    border:4px solid rgba(255,255,255,.72);
  }

  .main-viewport{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#151719;
  }

  #mainRunway{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  .north-badge{
    position:absolute;
    left:18px;
    top:18px;
    z-index:10;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border-radius:999px;
    background:rgba(17,17,17,.74);
    color:#fff;
    font-size:12px;
    font-weight:800;
    letter-spacing:.08em;
    backdrop-filter:blur(8px);
  }

  .north-arrow{
    width:0;
    height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-bottom:12px solid var(--green);
  }

  .vehicle{
    position:absolute;
    left:50%;
    top:50%;
    bottom:auto;
    transform:translate(-50%,-50%);
    width:202.5px;
    height:281.25px;
    z-index:8;
    filter:drop-shadow(0 12px 14px rgba(0,0,0,.45));
  }

  .inspection-controls{
    position:absolute;
    right:18px;
    bottom:18px;
    z-index:15;
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px;
    background:rgba(17,17,17,.82);
    border:2px solid var(--green);
    border-radius:999px;
    backdrop-filter:blur(10px);
  }

  button{font:inherit}

  .start-btn{
    min-height:38px;
    padding:0 16px;
    border:0;
    border-radius:999px;
    background:rgba(255,255,255,.08);
    color:var(--green);
    font-size:13px;
    font-weight:800;
    cursor:pointer;
    white-space:nowrap;
  }

  .start-btn:hover{
    background:var(--green);
    color:#fff;
  }

  .icon-btn{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    color:#fff;
    display:grid;
    place-items:center;
    cursor:pointer;
  }

  .icon-btn:hover{
    background:rgba(255,255,255,.16);
    color:var(--green);
  }

  .icon-btn svg{
    width:21px;
    height:21px;
  }

  .progress-badge{
    position:absolute;
    right:18px;
    top:18px;
    z-index:10;
    padding:9px 12px;
    border-radius:999px;
    background:rgba(17,17,17,.74);
    color:#fff;
    font-size:12px;
    font-weight:800;
    backdrop-filter:blur(8px);
  }

  .overview-card{
    background:#fdfdfd;
    border:1px solid var(--border);
    padding:clamp(12px, 1.2vw, 14px);
    display:flex;
    flex-direction:column;
  }

  .overview-head{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    text-align:center;
  }

  .overview-head strong{
    font-size:14px;
    display:block;
    width:100%;
  }

  .overview-stage{
    position:relative;
    flex:1;
    min-height:0;
    background:#7fa052;
    border-radius:14px;
    overflow:hidden;
    border:1px solid #b8c0c7;
  }

  #overviewRunway{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  @keyframes overviewCarGlow{
    0%,100%{
      opacity:.88;
      box-shadow:0 0 0 0 rgba(252,209,42,.18), 0 0 7px rgba(252,209,42,.28);
    }
    50%{
      opacity:1;
      box-shadow:0 0 0 4px rgba(252,209,42,.10), 0 0 14px rgba(252,209,42,.48);
    }
  }

  #overviewWindow{
    position:absolute;
    left:25%;
    width:50%;
    border:3px solid var(--green);
    background:transparent !important;
    border-radius:6px;
    pointer-events:none;
    box-shadow:none !important;
  }

  #overviewCar{
    position:absolute;
    left:50%;
    transform:translate(-50%,-50%);
    width:4.5%;
    aspect-ratio:2 / 3;
    height:auto;
    border-radius:4px;
    background:#ffd400;
    border:none;
    box-shadow:0 0 8px rgba(252,209,42,.35);
    animation:overviewCarGlow 2.8s ease-in-out infinite;
    pointer-events:none;
  }

  .overview-footer{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:10px;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    text-align:center;
  }

  .remaining{
    display:none;
  }

  .mini-key{
    display:flex;
    align-items:center;
    gap:5px;
  }

  .mini-box{
    width:14px;
    height:9px;
    border:2px solid var(--green);
    border-radius:2px;
  }

  .game-shell:fullscreen{
    height:100vh;
    max-width:none;
    background:#111;
    padding:14px;
  }

  .game-shell:fullscreen .main-card{
    border-radius:18px;
  }

  .game-shell:fullscreen{
    grid-template-columns:minmax(0,1fr) minmax(230px,20vw);
  }

  .game-shell:fullscreen .overview-card{
    min-width:230px;
  }

  .game-shell:fullscreen #overviewWindow{
    left:12%;
    width:76%;
    border:3px solid var(--green);
    border-radius:6px;
    box-shadow:none !important;
  }

  @media(max-width:900px){
    .game-shell{
      grid-template-columns:1fr;
      height:auto;
      min-height:0;
    }

    .main-card{
      height:68vh;
      min-height:520px;
    }

    .overview-card{height:360px}
    .overview-stage{min-height:280px}
  }
</style>
</head>

<script>
(() => {
  const SVG_HEIGHT = 5000;
  const VIEW_HEIGHT = 1000;
  const START_Y = 4000;
  const END_Y = 0;
  const DURATION = 30000;

  const mainRunway = document.getElementById('mainRunway');
  const overviewWindow = document.getElementById('overviewWindow');
  const overviewCar = document.getElementById('overviewCar');
  const overviewStage = document.getElementById('overviewStage');
  const progressBadge = document.getElementById('progressBadge');
  const remainingText = document.getElementById('remainingText');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const gameShell = document.getElementById('gameShell');

  let progress = 0;
  let running = false;
  let raf = null;
  let lastTs = null;

  function updateVisuals() {
    const y = START_Y + (END_Y - START_Y) * progress;
    mainRunway.setAttribute('viewBox', `0 ${y.toFixed(2)} 600 ${VIEW_HEIGHT}`);

    const stageH = overviewStage.clientHeight || 1;
    const viewHpx = stageH * (VIEW_HEIGHT / SVG_HEIGHT);

    // The overview focuses on the lower portion of the active viewport
    // so the highlighted box frames the runway number and threshold stripes.
    // In fullscreen, expand the overview box vertically so it includes
    // the complete runway number 18 plus the threshold stripes below it.
    // Width remains edge-to-edge across the right-side overview panel.
    const isFullscreen = !!document.fullscreenElement;
    const overviewTopY = y + (VIEW_HEIGHT * (isFullscreen ? 0.29 : 0.38));
    const overviewWindowHpx = Math.max(
      18,
      viewHpx * (isFullscreen ? 0.65 : 0.50)
    );
    const overviewWindowTopPx = Math.max(0, Math.min(
      stageH - overviewWindowHpx,
      stageH * (overviewTopY / SVG_HEIGHT)
    ));

    overviewWindow.style.height = `${overviewWindowHpx}px`;
    overviewWindow.style.top = `${overviewWindowTopPx}px`;

    // Keep the small yellow marker between 18 and the threshold stripes.
    const carY = overviewWindowTopPx
      + overviewWindowHpx * (isFullscreen ? 0.32 : 0.45);

    overviewCar.style.top =
      `${Math.max(7, Math.min(stageH - 7, carY))}px`;

    const complete = Math.round(progress * 100);

    progressBadge.textContent = `${complete}% COMPLETE`;
    if (remainingText) remainingText.textContent = '';
  }

  function frame(ts) {
    if (!running) return;

    if (lastTs === null) lastTs = ts;

    const delta = ts - lastTs;
    lastTs = ts;

    progress = Math.min(1, progress + delta / DURATION);

    updateVisuals();

    if (progress >= 1) {
      running = false;
      startBtn.textContent = 'Runway Check Complete';
      pauseBtn.setAttribute('title','Start Motion');
      return;
    }

    raf = requestAnimationFrame(frame);
  }

  function start() {
    if (progress >= 1) progress = 0;
    if (running) return;

    running = true;
    lastTs = null;

    startBtn.textContent = 'Runway Check Running';
    pauseBtn.setAttribute('title','Pause Motion');

    raf = requestAnimationFrame(frame);
  }

  function pause() {
    running = false;
    lastTs = null;

    if (raf) cancelAnimationFrame(raf);

    startBtn.textContent =
      progress > 0 ? 'Resume Runway Check' : 'Start Runway Check';

    pauseBtn.setAttribute('title','Start Motion');
  }

  function reset() {
    pause();
    progress = 0;
    updateVisuals();
    startBtn.textContent = 'Start Runway Check';
  }

  startBtn.addEventListener('click', start);

  pauseBtn.addEventListener('click', () => {
    running ? pause() : start();
  });

  resetBtn.addEventListener('click', reset);

  fullscreenBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        await gameShell.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (e) {}
  });

  document.addEventListener('fullscreenchange', () => {
    setTimeout(updateVisuals, 50);
  });

  window.addEventListener('resize', updateVisuals);

  updateVisuals();
})();
</script>

</body>
</html>
