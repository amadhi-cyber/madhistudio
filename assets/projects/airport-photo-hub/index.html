<style id="madhi-demo-only-style">
  .madhi-demo-notice {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 99999;
    transform: translate(-50%, -50%) scale(.96);
    padding: 13px 22px;
    border-radius: 999px;
    background: rgba(17,17,17,.92);
    color: #fff;
    font: 700 15px/1.2 Arial, Helvetica, sans-serif;
    letter-spacing: .02em;
    box-shadow: 0 12px 32px rgba(0,0,0,.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
  }
  .madhi-demo-notice.is-visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  html.madhi-demo-mode a { cursor: not-allowed !important; }
</style>
<script id="madhi-demo-only-script">
(() => {
  const params = new URLSearchParams(window.location.search);
  if (params.get('demo') !== '1') return;
  document.documentElement.classList.add('madhi-demo-mode');

  const notice = document.createElement('div');
  notice.className = 'madhi-demo-notice';
  notice.setAttribute('role','status');
  notice.setAttribute('aria-live','polite');
  notice.textContent = 'Demo Only';
  document.body.appendChild(notice);

  let timer = null;
  const showNotice = () => {
    clearTimeout(timer);
    notice.classList.add('is-visible');
    timer = setTimeout(() => notice.classList.remove('is-visible'), 1350);
  };

  document.addEventListener('pointerover', (event) => {
    const link = event.target.closest('a[href]');
    if (!link) return;
    const fromLink = event.relatedTarget?.closest?.('a[href]');
    if (fromLink === link) return;
    showNotice();
  }, true);

  document.addEventListener('click', (event) => {
    const link = event.target.closest('a[href]');
    if (!link) return;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    showNotice();
  }, true);
})();
</script>
