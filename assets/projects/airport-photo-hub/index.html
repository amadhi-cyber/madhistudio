<script id="madhi-demo-only-script">
(() => {
  const params = new URLSearchParams(window.location.search);
  const demoMode = params.get('demo');
  if (demoMode === '3') {
    document.documentElement.classList.add('madhi-portfolio-preview');
    return;
  }
  if (demoMode !== '1') return;
  document.documentElement.classList.add('madhi-demo-mode');

  const notice = document.createElement('div');
  notice.className = 'madhi-demo-notice';
  notice.setAttribute('role','status');
  notice.setAttribute('aria-live','polite');
  notice.textContent = 'Demo Only';
  document.body.appendChild(notice);

  let timer = null;
  const showNotice = () => {
    clearTimeout(timer);
    notice.classList.add('is-visible');
    timer = setTimeout(() => notice.classList.remove('is-visible'), 1350);
  };

  document.addEventListener('pointerover', (event) => {
    const link = event.target.closest('a[href]');
    if (!link) return;
    const fromLink = event.relatedTarget?.closest?.('a[href]');
    if (fromLink === link) return;
    showNotice();
  }, true);

  document.addEventListener('click', (event) => {
    const link = event.target.closest('a[href]');
    if (!link) return;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    showNotice();
  }, true);
})();
</script>
