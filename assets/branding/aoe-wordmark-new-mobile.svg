          <line x1="680" y1="310" x2="680" y2="640"/>
          <line x1="760" y1="310" x2="760" y2="640"/>
          <line x1="840" y1="310" x2="840" y2="640"/>
          <line x1="920" y1="310" x2="920" y2="640"/>
          <line x1="1000" y1="310" x2="1000" y2="640"/>

          <line x1="120" y1="365" x2="1080" y2="365"/>
          <line x1="120" y1="420" x2="1080" y2="420"/>
          <line x1="120" y1="475" x2="1080" y2="475"/>
          <line x1="120" y1="530" x2="1080" y2="530"/>
