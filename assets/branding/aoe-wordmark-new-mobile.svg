               h 106
               c 2.216,0 4,1.784 4,4
               v 6
               c 0,2.216 -1.784,4 -4,4
               H 156
               c -2.216,0 -4,-1.784 -4,-4
               v -6
               c 0,-2.216 1.784,-4 4,-4 z"/>

        </g>
      </g>
    </svg>

