               10.633-1.7908 21.753-8.9851 19.286-22.143
               0 0-10.746-88.36-19.286-102.86
               -10.191-17.302-65-76.429-65-76.429
               l15.714-70
               s10.086 20.446 17.143 29.286
               c8.0255 10.053 58.571 39.286 58.571 39.286
               4.6363 3.1097 15.133 1.3962 19.286-6.4286
               3.3332-6.2806 3.1763-16.454-4.2857-21.429
               0 0-41.655-26.151-51.429-34.286
               -10.87-9.03-32.86-69.27-32.86-69.27
               -6.8208-9.3864-16.151-19.742-32.143-20
               -16.119-0.26028-24.187 8.6196-31.429 13.571
               0 0-61.747 45.105-67.857 54.286
               -6.1469 9.236-17.143 78.571-17.143 78.571
               -1.7236 7.9 1.3621 14.253 10.714 16.429
               11.443 2.662 19.645-4.4634 20.714-10
               0 0 7.0508-54.765 12.143-62.857
               5.9288-9.4214 26.346-20.521
               26.346-20.521z"/>

