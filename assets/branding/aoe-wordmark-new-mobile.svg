    <g class="aoe-passenger-motion">

      <svg
        x="1040"
        y="348"
        width="62"
        height="62"
        viewBox="0 0 512 512"
        aria-hidden="true">

        <!-- Walking passenger -->
        <g
          fill="#07090c"
          transform="
            translate(188 10)
            scale(0.956421 0.958980)
            translate(-169.77 -382.33)
            translate(-256.58 42.426)
