               h 82
               l -14,30
               h -54 z"/>

          <path
            d="m 187,132
               h 44
               c 1.662,0 3,1.338 3,3
               v 4
               c 0,1.662 -1.338,3 -3,3
               h -44
               c -1.662,0 -3,-1.338 -3,-3
               v -4
               c 0,-1.662 1.338,-3 3,-3 z"/>

          <path
            d="m 193,142
               h 32
               l 15,260
               h -62 z"/>

          <path
            d="m 170,402
               h 78
               c 2.216,0 4,1.784 4,4
               v 10
               c 0,2.216 -1.784,4 -4,4
               h -78
               c -2.216,0 -4,-1.784 -4,-4
               v -10
