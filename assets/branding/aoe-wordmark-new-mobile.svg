        fill="#07090c"
        transform="matrix(1.3,0,0,1,-35.4,-17.214701)">

        <g transform="translate(-14,-37.785299)">

          <path
            d="m 209,58
               c 1.662,0 3,1.338 3,3
               v 22
               c 0,1.662 -1.338,3 -3,3
               -1.662,0 -3,-1.338 -3,-3
               V 61
               c 0,-1.662 1.338,-3 3,-3 z"/>

          <path
            d="m 214,52
               a 5,5 0 0 1 -5,5
               5,5 0 0 1 -5,-5
               5,5 0 0 1 5,-5
               5,5 0 0 1 5,5 z"/>

          <path
