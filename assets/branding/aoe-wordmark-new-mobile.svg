<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 930"
     width="100%"
     height="100%"
     role="img"
     aria-labelledby="aoeTitle aoeDesc">
  <title id="aoeTitle">Airport Operations Explained — animated airport arrival wordmark</title>
  <desc id="aoeDesc">Airport Operations Explained wordmark paired with an animated airplane landing beside an airport terminal and control tower, followed by a passenger walking away with luggage.</desc>

  <defs>
    <linearGradient id="aoeGlassGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fe7f3"/>
      <stop offset="45%" stop-color="#65c6d9"/>
      <stop offset="100%" stop-color="#46afc5"/>
    </linearGradient>

    <linearGradient id="aoeUpperGlassGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6eaf4"/>
      <stop offset="100%" stop-color="#58bfd3"/>
    </linearGradient>

    <style>
      .aoe-plane-motion {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: aoePlaneLanding 12s linear infinite;
      }

      .aoe-passenger-motion {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: aoePassengerWalk 12s linear infinite;
      }

      @keyframes aoePlaneLanding {
        0% {
          opacity: 0;
          transform: translate(-390px, -118px) rotate(18deg) scale(.98);
        }

        4.1% {
          opacity: 1;
          transform: translate(-360px, -110px) rotate(18deg) scale(.98);
        }

        54.2% {
          opacity: 1;
          transform: translate(0, 0) rotate(18deg) scale(.98);
        }

        58.3%,
        100% {
          opacity: 0;
          transform: translate(0, 0) rotate(18deg) scale(.98);
        }
      }

      @keyframes aoePassengerWalk {
        0%,
        59.6% {
          opacity: 0;
          transform: translateX(8px);
        }

        59.7% {
          opacity: 1;
          transform: translateX(8px);
        }

        98% {
          opacity: 1;
          transform: translateX(300px);
        }

        100% {
          opacity: 0;
          transform: translateX(300px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .aoe-plane-motion,
        .aoe-passenger-motion {
          animation: none !important;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </defs>

  <!-- =========================================================
       AIRPORT OPERATIONS EXPLAINED WORDMARK
       ========================================================= -->

  <g id="aoe-wordmark" transform="translate(450 500)">
    <text
      x="0"
      y="174"
      fill="#111184"
      font-family="Quicksand, 'Avenir Next', Arial, sans-serif"
      font-size="72"
      font-weight="600"
      letter-spacing="-0.2"
      text-anchor="middle">
      Airport
    </text>

    <text
      x="0"
      y="248"
      fill="#111184"
      font-family="Quicksand, 'Avenir Next', Arial, sans-serif"
      font-size="72"
      font-weight="600"
      letter-spacing="-0.2"
      text-anchor="middle">
      Operations
    </text>

    <rect
      x="-174"
      y="278"
      width="348"
      height="82"
      rx="41"
      fill="#c9eff5"/>

    <text
      x="0"
      y="336"
      fill="#5B1166"
      font-family="Quicksand, 'Avenir Next', Arial, sans-serif"
      font-size="52"
      font-weight="700"
      text-anchor="middle">
      Explained
    </text>
  </g>

  <!-- =========================================================
       ARRIVING AIRPORT CLUSTER
       ========================================================= -->

  <g id="aoe-arrival-cluster" transform="translate(-510 -70)">

    <!-- Ground / runway line -->
    <line
      x1="595"
      y1="411"
      x2="1362"
      y2="411"
      stroke="#07090c"
      stroke-width="2"/>

    <!-- =====================================================
         CONTROL TOWER
