          <rect x="348" y="205" width="14" height="105"/>
          <rect x="451" y="205" width="14" height="105"/>
          <rect x="554" y="205" width="14" height="105"/>
          <rect x="657" y="205" width="14" height="105"/>
          <rect x="760" y="205" width="14" height="105"/>
          <rect x="863" y="205" width="14" height="105"/>
          <rect x="941" y="205" width="14" height="105"/>
        </g>

        <!-- Middle pane line -->
        <line
          x1="245"
          y1="258"
          x2="955"
          y2="258"
          stroke="#c9eef4"
          stroke-width="2"
          opacity="0.72"/>

        <!-- Top tier frames -->
        <g fill="#304b55">
          <rect x="345" y="105" width="14" height="100"/>
          <rect x="447" y="105" width="14" height="100"/>
          <rect x="549" y="105" width="14" height="100"/>
          <rect x="651" y="105" width="14" height="100"/>
          <rect x="753" y="105" width="14" height="100"/>
          <rect x="841" y="105" width="14" height="100"/>
        </g>

        <!-- Top pane line -->
        <line
          x1="345"
          y1="155"
          x2="855"
          y2="155"
          stroke="#c9eef4"
          stroke-width="2"
          opacity="0.75"/>

      </g>
    </svg>

    <!-- =====================================================
         ARRIVING AIRPLANE
         ===================================================== -->

    <g class="aoe-plane-motion">

      <svg
        x="915"
        y="320"
        width="94"
        height="53"
        viewBox="0 0 260 145"
        aria-hidden="true">

        <g
