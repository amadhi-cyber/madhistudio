    <polygon points="47,135 70,84 93,135" fill="#0B6623"/>
    <circle cx="182" cy="80" r="47" stroke="#98FB98" stroke-width="10" fill="none"/>
    <circle cx="182" cy="80" r="12" fill="#0B6623"/>
    <rect x="244" y="100" width="16" height="35" fill="#0B6623"/>
    <rect x="266" y="66" width="16" height="69" fill="#0B6623"/>
    <rect x="288" y="32" width="16" height="103" fill="#0B6623"/>
  </g>
  <text class="text-main" x="210" y="232">AIRPORT</text>
  <text class="text-main" x="210" y="276">OPERATIONS</text>
