<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 470" width="100%" height="100%" role="img" aria-labelledby="title desc" style="background:transparent">
  <title id="title">Airport Operations Intelligence stacked mobile logo</title>
  <desc id="desc">Mobile stacked version of the AOI logo with the mark above the wordmark.</desc>
  <style>
    .text-main { font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 600; fill: #98FB98; text-anchor: middle; }
    .text-sub { font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 600; fill: #0B6623; text-anchor: middle; }
  </style>
  <g transform="translate(52 42) scale(0.95)">
