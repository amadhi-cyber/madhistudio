<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 105 760 151" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Airport Operations Intelligence Logo Horizontal</title>
  <desc id="desc">Horizontal AOI logo with brand text placed to the right.</desc>

  <rect x="0" y="105" width="760" height="151" fill="transparent"/>

  <style>
    .text-white {
      font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 34px;
      font-weight: 600;
      fill: #FFFFFF;
    }

    .text-purple {
      font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 34px;
      font-weight: 600;
      fill: #FFFF00;
    }
  </style>

  <!-- AOI Mark -->
  <g transform="translate(-120, 0) scale(1.3, 1.3)">
    <polygon points="143,85 187,190 173,190 143,122 113,190 99,190" fill="#FFFFFF"/>
    <polygon points="122,190 143,143 164,190" fill="#FFFF00"/>

    <circle cx="245" cy="140" r="42" stroke="#FFFFFF" stroke-width="9" fill="none"/>
    <circle cx="245" cy="140" r="11" fill="#FFFF00"/>

    <rect x="312" y="158" width="13" height="32" fill="#FFFF00"/>
    <rect x="331" y="128" width="13" height="62" fill="#FFFF00"/>
    <rect x="350" y="98" width="13" height="92" fill="#FFFF00"/>
  </g>

  <!-- Brand Text to Right -->
  <text x="420" y="145" class="text-white">AIRPORT</text>
  <text x="420" y="195" class="text-white">OPERATIONS</text>
  <text x="420" y="245" class="text-purple">INTELLIGENCE</text>
</svg>