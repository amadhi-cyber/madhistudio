<svg viewBox="0 0 430 500"
  width="100%"
  height="100%"
  preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg">

  <rect width="430" height="500" fill="white"/>

  <g font-family="DIN Condensed, Roboto Condensed, Arial Narrow, sans-serif"
    fill="#686868"
    text-anchor="middle"
    letter-spacing="1.2">

    <text x="215" y="365" font-size="28" font-weight="600">AIRPORT</text>
    <text x="215" y="400" font-size="28" font-weight="600">OPERATIONS</text>
    <text x="215" y="435" font-size="28" font-weight="600">INTELLIGENCE</text>
  </g>

  <g transform="translate(215 190)">

    <!-- THREE RADAR CIRCLES -->
    <circle cx="0" cy="0" r="90"
      fill="none"
      stroke="#000"
      stroke-width="2"
      opacity="0.35"/>

    <circle cx="0" cy="0" r="60"
      fill="none"
      stroke="#000"
      stroke-width="2"
      opacity="0.25"/>

    <circle cx="0" cy="0" r="30"
      fill="none"
      stroke="#000"
      stroke-width="2"
      opacity="0.18"/>

    <!-- ROTATING RADAR SWEEP -->
    <circle cx="0" cy="0" r="90"
      fill="none"
      stroke="url(#sweep)"
      stroke-width="10"
      stroke-linecap="round"
      opacity="0.35">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="4.5s"
        repeatCount="indefinite"/>
    </circle>

    <defs>
      <linearGradient id="sweep">
        <stop offset="0%"
          stop-color="#000"
          stop-opacity="0"/>

        <stop offset="60%"
          stop-color="#000"
          stop-opacity="0.2"/>

        <stop offset="100%"
          stop-color="#000"
          stop-opacity="0.9"/>
      </linearGradient>
    </defs>

    <!-- RUNWAY -->
    <rect
      x="-5"
      y="-30"
      width="10"
      height="60"
      fill="white"
      stroke="#000"
      stroke-width="1.5"/>

    <line
      x1="0"
      y1="-25"
      x2="0"
      y2="25"
      stroke="#000"
      stroke-width="1.5"
      stroke-dasharray="6,6"/>

    <!-- RUNWAY / SIGNAL NODES -->
    <circle
      cx="0"
      cy="-30"
      r="2.5"
      fill="#00FF00"/>

    <circle
      cx="0"
      cy="-90"
      r="2.5"
      fill="#00FF00"/>

    <circle
      cx="-85"
      cy="30"
      r="2.5"
      fill="#00FF00"/>

    <circle
      cx="85"
      cy="30"
      r="2.5"
      fill="#00FF00"/>

    <!-- CONNECTIONS -->
    <line
      x1="0"
      y1="-90"
      x2="-85"
      y2="30"
      stroke="#0603b2"
      stroke-width="1.5"/>

    <line
      x1="0"
      y1="-90"
      x2="85"
      y2="30"
      stroke="#0603b2"
      stroke-width="1.5"/>

    <line
      x1="-85"
      y1="30"
      x2="0"
      y2="-30"
      stroke="#0603b2"
      stroke-width="1.5"/>

    <line
      x1="85"
      y1="30"
      x2="0"
      y2="-30"
      stroke="#0603b2"
      stroke-width="1.5"/>

    <!-- AIRPLANE -->
    <g transform="translate(12,-50) rotate(135) scale(0.28)">
      <path
        fill="#0603b2"
        d="M59.4,4.5c-1.6-1.6-6.8,1.2-8.4,2.8l-6.2,6.2H16.4c-0.7,0-1.3,0.5-1.4,1.1c-0.1,0.7,0.2,1.3,0.9,1.6l18.8,7.4L23.1,35.1
        H12.2c-0.2,0-0.4,0.2-0.5,0.4c0,0.2,0.1,0.5,0.3,0.5l9.2,3.6c0.1,0.2,0.1,0.5,0.2,0.7L21,40.7c-0.6,0.6-0.6,1.5,0,2.1
        c0.6,0.6,1.5,0.6,2.1,0l0.4-0.4c0.2,0.1,0.5,0.2,0.7,0.2l3.5,9c0.1,0.2,0.3,0.3,0.5,0.3c0.1,0,0.2-0.1,0.3-0.1
        c0.1-0.1,0.1-0.2,0.1-0.3V40.9l11.7-11.7L47.7,48c0.2,0.6,0.9,1,1.6,0.9c0.3-0.1,0.5-0.2,0.7-0.4
        c0.3-0.3,0.4-0.6,0.4-1V19.1l6.2-6.2C58.2,11.3,60.9,6,59.4,4.5z"/>
    </g>

  </g>
</svg>